name: deadlinebetter

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deadlinebetter
      POSTGRES_USER: deadlinebetter_dev
      POSTGRES_PASSWORD: local_dev
    ports:
      - "5432:5432"
    volumes:
      - deadlinebetter_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U deadlinebetter_dev -d deadlinebetter" ]
      interval: 5s
      timeout: 10s
      retries: 5

volumes:
  deadlinebetter_data:
